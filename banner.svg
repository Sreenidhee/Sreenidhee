<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sreenidhee Vidya Modugu, Software Engineer and ML Engineer">
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,Menlo,monospace; }
    .sans { font-family: 'Segoe UI',Helvetica,Arial,sans-serif; }
    .line { opacity: 0; animation: show .35s ease-out forwards; }
    .l1 { animation-delay: .2s; }  .l2 { animation-delay: .7s; }
    .l3 { animation-delay: 1.3s; } .l4 { animation-delay: 1.8s; }
    .l5 { animation-delay: 2.4s; } .l6 { animation-delay: 2.9s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes show { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="258" rx="14" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
  <!-- title bar -->
  <path d="M1 15a14 14 0 0 1 14-14h870a14 14 0 0 1 14 14v23H1z" fill="#111a2e"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="20" r="6" fill="#febc2e"/>
  <circle cx="66" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" class="mono" font-size="13" fill="#64748b"></text>
  <rect x="1" y="38" width="898" height="3" fill="url(#edge)"/>

  <!-- whoami -->
  <text x="34" y="114" class="sans line l2" font-size="30" font-weight="700" fill="#f8fafc">Sreenidhee Vidya Modugu</text>

  <!-- role -->
  <text x="34" y="178" class="mono line l4" font-size="17" fill="#5eead4">Software Engineer · ML Engineer  <tspan fill="#94a3b8">// Go · Java · Kafka · PyTorch</tspan></text>

  <!-- status -->
  <text x="34" y="240" class="mono line l6" font-size="17" fill="#94a3b8">M.S. CIS @ University of Florida · <tspan fill="#4ade80">open to SDE &amp; MLE roles</tspan><tspan fill="#2dd4bf" class="cursor">&#160;▌</tspan></text>
</svg>
